[project]
name = "whisper-dictation"
version = "0.6.0"
description = "Offline Whisper-based dictation for Linux desktops (KDE Wayland)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
]

[project.scripts]
whisper-toggle = "whisper_dictation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisper_dictation"]
